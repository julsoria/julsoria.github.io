{{/* A year or group heading inside an entry list. Named params only, because Hugo does not
     allow mixing positional and named arguments in one call:

       {{< yr title="2026" first="true" >}}   first heading on the page
       {{< yr title="2025" >}}                subsequent headings (extra top margin) */}}
<h3{{ if not (.Get "first") }} class="grp"{{ end }}>{{ .Get "title" }}</h3>
