{{/* Styles for the hand-maintained entry lists (talks, teaching, publications, service).

     Kept here rather than in a <style> block inside each content file: there are ten such
     files across the two languages, and duplicating the rules in all of them meant a style
     tweak had to be made ten times. Content files now carry content only.

     The matching shortcodes live in layouts/_shortcodes/. */}}
<style>
/* ---- shared entry rows ------------------------------------------------ */
.entries .e{margin:0 0 1.4rem}
.entries .t{font-weight:700;line-height:1.35;margin-bottom:.15rem}
.entries .v{font-size:.94em;opacity:.85}
.entries h3{margin:0 0 1.25rem;padding-bottom:.35rem;
  border-bottom:1px solid rgba(120,120,120,.25)}
.entries .grp,.entries .yr{margin-top:2.5rem}
.entries .note{font-size:.94em;opacity:.85;margin-top:1.75rem;
  padding-top:1rem;border-top:1px solid rgba(120,120,120,.2)}

/* level pill, e.g. M2 / L3 */
.entries .lvl{font-size:.78em;font-weight:600;letter-spacing:.02em;
  border:1px solid rgba(120,120,120,.4);border-radius:999px;
  padding:.05rem .5rem;margin-left:.5rem;opacity:.75;white-space:nowrap}

/* award/venue badge. Dark colour keys off the theme's own `.dark` class --
   a :root:not([data-theme=light]) selector would also match the default
   "system" state and put pale yellow on a white background. */
.entries .badge{font-size:.78em;font-weight:600;letter-spacing:.02em;
  border:1px solid rgba(202,138,4,.55);color:#a16207;background:rgba(234,179,8,.12);
  border-radius:999px;padding:.05rem .5rem;margin-left:.35rem;white-space:nowrap}
.dark .entries .badge{color:#fde047}

/* ---- publication list ------------------------------------------------- */
.publist .pub{display:flex;gap:1.25rem;align-items:flex-start;margin:0 0 1.75rem}
/* Emoji match each paper's project-page favicon. Explicit emoji font stack so they
   render in colour rather than as glyph outlines. */
.publist .icon{flex:0 0 3rem;width:3rem;font-size:2.25rem;line-height:1.2;
  text-align:center;user-select:none;
  font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji","Twemoji Mozilla",sans-serif}
/* margin:0 is required -- Tailwind `prose` gives img a 2em top margin, which would push a
   logo down to the bottom of the entry instead of aligning it with the title. */
.publist .icon img{width:100%;height:auto;display:block;margin:0}
.publist .meta{flex:1 1 auto;min-width:0}
.publist .t{font-weight:700;line-height:1.35;margin-bottom:.15rem}
.publist .a{font-size:.94em;opacity:.85;margin-bottom:.1rem}
.publist .v{font-size:.94em;font-style:italic;opacity:.85;margin-bottom:.35rem}
.publist .l{font-size:.9em}
.publist .l a{margin-right:.75rem;white-space:nowrap}
.publist h3{margin:0 0 1.25rem;padding-bottom:.35rem;
  border-bottom:1px solid rgba(120,120,120,.25)}
.publist .yr{margin-top:2.5rem}
@media(max-width:640px){.publist .icon{flex-basis:2.25rem;width:2.25rem;font-size:1.6rem}}

/* ---- news list: fixed date and star columns so every body aligns ------ */
.nw{display:grid;grid-template-columns:5.6rem 1.6rem 1fr;align-items:baseline;
  margin:0 0 .85rem}
.nw-d{font-weight:700;white-space:nowrap}
.nw-s{text-align:center;line-height:1;
  font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji","Twemoji Mozilla",sans-serif}
.nw-b{min-width:0}
.nw-b p{margin:0}
/* French month labels are wider ("Juil.", "Août") */
:lang(fr) .nw{grid-template-columns:6.4rem 1.6rem 1fr}
@media(max-width:640px){
  .nw{grid-template-columns:1.6rem 1fr;row-gap:.15rem}
  .nw-d{grid-column:1 / -1}
}

/* ---- contact address: literal text, not a link ------------------------ */
.eml{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  font-size:.92em;white-space:nowrap;background:rgba(120,120,120,.14);
  border-radius:5px;padding:.1rem .45rem}
</style>
