{{/* Styles for the hand-maintained entry lists (talks, teaching, publications, service).

     Kept here rather than in a <style> block inside each content file: there are ten such
     files across the two languages, and duplicating the rules in all of them meant a style
     tweak had to be made ten times. Content files now carry content only.

     The matching shortcodes live in layouts/_shortcodes/. */}}
<style>
/* ---- shared entry rows ------------------------------------------------ */
.entries .e{margin:0 0 1.4rem}
.entries .t{font-weight:700;line-height:1.35;margin-bottom:.15rem}
.entries .v{font-size:.94em;opacity:.85}
.entries h3{margin:0 0 1.25rem;padding-bottom:.35rem;
  border-bottom:1px solid rgba(120,120,120,.25)}
.entries .grp,.entries .yr{margin-top:2.5rem}
.entries .note{font-size:.94em;opacity:.85;margin-top:1.75rem;
  padding-top:1rem;border-top:1px solid rgba(120,120,120,.2)}

/* level pill, e.g. M2 / L3 */
.entries .lvl{font-size:.78em;font-weight:600;letter-spacing:.02em;
  border:1px solid rgba(120,120,120,.4);border-radius:999px;
  padding:.05rem .5rem;margin-left:.5rem;opacity:.75;white-space:nowrap}

/* award/venue badge. Dark colour keys off the theme's own `.dark` class --
   a :root:not([data-theme=light]) selector would also match the default
   "system" state and put pale yellow on a white background. */
.entries .badge{font-size:.78em;font-weight:600;letter-spacing:.02em;
  border:1px solid rgba(202,138,4,.55);color:#a16207;background:rgba(234,179,8,.12);
  border-radius:999px;padding:.05rem .5rem;margin-left:.35rem;white-space:nowrap}
.dark .entries .badge{color:#fde047}

/* ---- publication list ------------------------------------------------- */
.publist .pub{display:flex;gap:1.25rem;align-items:flex-start;margin:0 0 1.75rem}
/* Emoji match each paper's project-page favicon. Explicit emoji font stack so they
   render in colour rather than as glyph outlines. */
.publist .icon{flex:0 0 3rem;width:3rem;font-size:2.25rem;line-height:1.2;
  text-align:center;user-select:none;
  font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji","Twemoji Mozilla",sans-serif}
/* margin:0 is required -- Tailwind `prose` gives img a 2em top margin, which would push a
   logo down to the bottom of the entry instead of aligning it with the title. */
.publist .icon img{width:100%;height:auto;display:block;margin:0}
.publist .meta{flex:1 1 auto;min-width:0}
.publist .t{font-weight:700;line-height:1.35;margin-bottom:.15rem}
.publist .a{font-size:.94em;opacity:.85;margin-bottom:.1rem}
.publist .v{font-size:.94em;font-style:italic;opacity:.85;margin-bottom:.35rem}
.publist .l{font-size:.9em}
.publist .l a{margin-right:.75rem;white-space:nowrap}
.publist h3{margin:0 0 1.25rem;padding-bottom:.35rem;
  border-bottom:1px solid rgba(120,120,120,.25)}
.publist .yr{margin-top:2.5rem}
@media(max-width:640px){.publist .icon{flex-basis:2.25rem;width:2.25rem;font-size:1.6rem}}

/* ---- divider between the contact box and the news list --------------- */
.sep{border:0;height:2px;width:clamp(4rem,20%,9rem);margin:2.5rem auto 0;
  border-radius:2px;background:currentColor;opacity:.4}

/* ---- news list: fixed date and star columns so every body aligns ------ */
.nw{display:grid;grid-template-columns:5.6rem 1.6rem 1fr;align-items:baseline;
  margin:0 0 .85rem}
.nw-d{font-weight:700;white-space:nowrap}
.nw-s{text-align:center;line-height:1;
  font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji","Twemoji Mozilla",sans-serif}
.nw-b{min-width:0}
.nw-b p{margin:0}
/* French month labels are wider ("Juil.", "Août") */
:lang(fr) .nw{grid-template-columns:6.4rem 1.6rem 1fr}
@media(max-width:640px){
  .nw{grid-template-columns:1.6rem 1fr;row-gap:.15rem}
  .nw-d{grid-column:1 / -1}
}

/* ---- publication filter + CORE badge ---------------------------------- */
.pubfilter{display:flex;flex-wrap:wrap;gap:.4rem;margin:0 0 1.75rem}
.pubfilter button{font:inherit;font-size:.86em;font-weight:600;cursor:pointer;
  padding:.2rem .7rem;border-radius:999px;background:transparent;
  border:1px solid rgba(120,120,120,.45);color:inherit;opacity:.75;
  transition:opacity .15s,border-color .15s}
.pubfilter button:hover{opacity:1}
.pubfilter button.on{opacity:1;border-color:#2563eb;color:#2563eb}
.dark .pubfilter button.on{border-color:#93c5fd;color:#93c5fd}
.core{font-size:.78em;font-weight:600;letter-spacing:.02em;font-style:normal;
  border:1px solid rgba(120,120,120,.4);border-radius:999px;
  padding:.05rem .45rem;margin-left:.4rem;opacity:.8;white-space:nowrap}

/* CORE rank colours follow the published Google-Scholar-Orderer legend:
   A* dark green, A green, B yellow, C grey. */
.core-astar{border-color:rgba(21,128,61,.6);color:#15803d;background:rgba(34,197,94,.14)}
.core-a    {border-color:rgba(22,163,74,.5);color:#16a34a;background:rgba(34,197,94,.10)}
.core-b    {border-color:rgba(202,138,4,.55);color:#a16207;background:rgba(234,179,8,.12)}
.core-c    {border-color:rgba(120,120,120,.5);color:#6b7280;background:rgba(120,120,120,.10)}
.dark .core-astar{color:#4ade80}
.dark .core-a{color:#86efac}
.dark .core-b{color:#fde047}
.dark .core-c{color:#d1d5db}

/* link row: small inline glyph before each label */
.publist .l a{display:inline-flex;align-items:center;gap:.28rem}
.publist .l svg.li{width:.95em;height:.95em;flex:none}

/* right-hand venue logo column */
.publist .pub{align-items:flex-start}
.publist .vlogo{flex:0 0 5.5rem;display:flex;justify-content:flex-end;padding-top:.15rem}
.publist .vlogo img{max-width:5.5rem;max-height:2.6rem;width:auto;height:auto;margin:0;
  object-fit:contain}
.dark .publist .vlogo img{filter:brightness(0) invert(1);opacity:.85}
@media(max-width:640px){.publist .vlogo{display:none}}

/* ---- institution logos under the bio --------------------------------- */
.insts{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;
  gap:1.6rem;margin:.25rem 0 0}
.insts a{display:inline-flex;align-items:center;line-height:0;
  opacity:.85;transition:opacity .15s}
.insts a:hover{opacity:1}
.insts img{height:2.1rem;width:auto;margin:0}
/* Both marks are dark-on-transparent, so on a dark theme they would disappear.
   Invert-and-brighten would wreck CEA's red block, so sit them on a light chip
   instead and keep the brand colours correct. */
.dark .insts a{background:rgba(255,255,255,.92);border-radius:8px;padding:.35rem .55rem}
@media(max-width:640px){.insts img{height:1.7rem}.insts{gap:1.1rem}}

/* ---- contact address: literal text, not a link ------------------------ */
.eml{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  font-size:.92em;white-space:nowrap;background:rgba(120,120,120,.14);
  border-radius:5px;padding:.1rem .45rem}
</style>

<script>
/* Publication filter. Reveals its own buttons only when scripting is available, so the
   unfiltered list is what a reader without JS gets. Year headings whose entries are all
   filtered out are hidden too, otherwise a year could sit above nothing. */
document.addEventListener('DOMContentLoaded', function () {
  var bar = document.querySelector('.pubfilter');
  var list = document.querySelector('.publist');
  if (!bar || !list) return;
  bar.hidden = false;
  var pubs = [].slice.call(list.querySelectorAll('.pub'));
  var heads = [].slice.call(list.querySelectorAll('h3'));
  bar.addEventListener('click', function (e) {
    var btn = e.target.closest('button');
    if (!btn) return;
    var want = btn.dataset.f;
    bar.querySelectorAll('button').forEach(function (b) { b.classList.toggle('on', b === btn); });
    pubs.forEach(function (p) {
      p.hidden = !(want === 'all' || p.dataset.type === want);
    });
    heads.forEach(function (h) {
      var any = false;
      for (var n = h.nextElementSibling; n && n.tagName !== 'H3'; n = n.nextElementSibling) {
        if (n.classList.contains('pub') && !n.hidden) { any = true; break; }
      }
      h.hidden = !any;
    });
  });
});
</script>
