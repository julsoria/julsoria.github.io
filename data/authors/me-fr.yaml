bio: |
  Je suis doctorant en troisième année au CEA-List, Université Paris-Saclay, où je travaille
  sur la confiance que l'on peut accorder à l'intelligence artificielle, par le prisme de
  l'interprétabilité et de l'IA explicable formelle.

  Ma recherche pose une question simple : à quelles conditions l'explication d'un modèle
  est-elle *garantie* ? Les réseaux à raisonnement par cas, comme ProtoPNet, sont réputés
  « interprétables par construction », et pourtant leurs explications peuvent induire en
  erreur : deux entrées peuvent recevoir la même explication tout en étant classées
  différemment. Je développe les **explications latentes abductives (ALE)** — des conditions
  suffisantes sur la représentation latente d'un modèle qui impliquent démontrablement sa
  prédiction — à la rencontre de l'IA explicable formelle et de l'apprentissage à prototypes.

