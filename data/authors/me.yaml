role: PhD Candidate in Trustworthy AI

bio: |
  I am a third-year PhD candidate at CEA-List, Université Paris-Saclay, working on the
  trustworthiness of artificial intelligence through the lens of interpretability and
  formal explainable AI.

  My research asks what it takes for a model's explanation to come with a *guarantee*.
  Case-based reasoning networks such as ProtoPNet are often called "interpretable by
  design", yet their explanations can be misleading: two inputs may receive the same
  explanation and still be classified differently. I develop **Abductive Latent
  Explanations (ALEs)** — sufficient conditions on a model's latent representation that
  provably imply its prediction — bridging formal XAI and prototype-based learning.

