# Navigation Links
#   To link a homepage section, specify the URL as `/#` followed by the `id` of the
#   section block in `content/_index.md`.
#   The weight parameter defines the order that the links will appear in.

main:
  - name: Bio
    url: /
    weight: 10
  - name: Research
    url: /#research
    weight: 20
  - name: Publications
    url: /#publications
    weight: 30
  - name: Teaching
    url: /#teaching
    weight: 40
  - name: Experience
    url: experience/
    weight: 50
