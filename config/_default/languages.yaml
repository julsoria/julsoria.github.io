# Languages
#   One section per language. English is the default and is served from the site root;
#   French is served from /fr/ (defaultContentLanguageInSubdir is false in hugo.yaml).
#
#   Author profiles live in data/authors/ and are NOT language-aware, so each language
#   points its blocks at its own profile: `me` for English, `me-fr` for French. Keep the
#   two in sync when editing bio, education or experience.

en:
  locale: en-us
  label: English
  weight: 1
  contentDir: content/en

fr:
  locale: fr-fr
  label: Français
  weight: 2
  contentDir: content/fr
  title: Jules Soria
  params:
    description: "Jules Soria est doctorant au CEA-List, Université Paris-Saclay. Ses
      travaux portent sur l'IA de confiance : des explications formelles et interprétables
      pour les réseaux à prototypes."
  menu:
    main:
      - name: À propos
        url: /fr/
        weight: 10
      - name: Publications
        url: /fr/publications/
        weight: 20
      - name: Exposés
        url: /fr/talks/
        weight: 30
      - name: Enseignement
        url: /fr/teaching/
        weight: 40
      - name: CV
        url: /fr/cv/
        weight: 50
